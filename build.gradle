plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.23"
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.net.terracraft'
version = '2.0'

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
    maven { url "https://repo.essentialsx.net/releases" }
    maven {
        name = "jitpack"
        url = "https://jitpack.io/"
    }

    maven {
        name = "luckperms"
        url = "https://repo.lucko.me/repository/maven-public/"
    }
}


dependencies {
    // Paper API — включает Adventure (Component, MiniMessage, Audience)
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")

    implementation 'com.tchristofferson:ConfigUpdater:2.2-SNAPSHOT'
    implementation("org.bstats:bstats-bukkit:3.2.1")

    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly "net.luckperms:api:5.5"
    compileOnly 'com.github.Foulest:Vault:2.5.0'
}


shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.net.terracraft.welcome.libs.bstats'
    relocate 'com.tchristofferson.configupdater', 'ru.net.terracraft.welcome.libs.configupdater'
}


def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['paper-plugin.yml', 'lang/*.yml']) {
        expand props
    }
}