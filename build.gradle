plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.23"
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '2.0'

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.lucko.me/repository/maven-public/' }
    maven { url 'https://repo.codemc.io/repository/maven-public/' }
    maven { url 'https://repo.tchristofferson.com/repository/maven-snapshots/' }
}

dependencies {
    // Paper API
    paperweight.paperDevBundle('1.21.11-R0.1-SNAPSHOT')

    // ConfigLib (Exlll)
    implementation 'de.exlll:configlib-paper:4.8.1'

    // CommandAPI (Paper)
    compileOnly("dev.jorel:commandapi-paper-core:12.1.0")

    // Update checker (ez-plugins)
    implementation('com.github.ez-plugins:mc-plugin-update-notifier:1.0.0')

    // bStats
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // Compile-only
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'com.github.Foulest:Vault:2.5.0'
}

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.terracraft.welcome.libs.bstats'
    relocate 'de.exlll.configlib', 'ru.terracraft.welcome.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.terracraft.welcome.libs.updater'

    exclude 'org/yaml/snakeyaml/**'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'

    mergeServiceFiles()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    // paper-plugin.yml — expand ${version}
    filesMatching('paper-plugin.yml') {
        expand props
    }

}