# ═══════════════════════════════════════════
#  Welcome Plugin — Русский язык
# ═══════════════════════════════════════════

# ═══════════════ MOTD ═══════════════
motd:
  lines:
    - "<dark_purple>| <gold>Приветик, %player_name%!</gold></dark_purple>"
    - "<dark_purple>| <gray>Рады видеть тебя снова на сервере!</gray>"
    - "<dark_purple>| <green>ВК: %welcome_vk_url%</green>"
    - "<dark_purple>| <green>Сайт: %welcome_site_url%</green>"
    - "<dark_purple>| <green>Discord: %welcome_discord_url%</green>"
    - "<dark_purple>| <gray>Желаем приятной игры!</gray>"

# ═══════════════ TITLES ═══════════════
titles:
  first_join:
    title: "<gold>Добро пожаловать!</gold>"
    subtitle: "<gray>%player_name%, ты у нас впервые! <yellow>#%number%</yellow></gray>"
  join:
    title: "<green>С возвращением!</green>"
    subtitle: "<gray>%player_name%</gray>"
  death:
    title: "<red>Вы погибли!</red>"
    subtitle: "<gray>Но вы ещё вернётесь...</gray>"

# ═══════════════ ACTION BAR ═══════════════
actionbar:
  first_join: "<gold>✨ Добро пожаловать на сервер, %player_name%!</gold>"
  join: "<green>С возвращением, %player_name%!</green>"

# ═══════════════ JOIN (первый вход) ═══════════════
join:
  first_join:
    - "<gold>🎉 Новичок на сервере! Встречаем <white>%player_name%</white> бурными аплодисментами! <gray>(#%number%)</gray></gold>"
    - "<green>✨ <white>%player_name%</white> только что присоединился! <gray>(#%number%)</gray></green>"
    - "<aqua>Добро пожаловать, %player_name%! Ты #%number% новичок!</aqua>"

# ═══════════════ GROUPS ═══════════════
#  ID групп должны совпадать с groups.yml
#  Группа использует свои сообщения + сообщения из inherits
groups:

  # ─── Default — базовые ───
  default:
    join:
      - "<green>➕ <gray>Опа! <white>%player_name%</white> заглянул в гости. Не забудь тапки у входа!</gray>"
      - "<blue>%player_name% присоединился к нам!</blue>"
      - "<yellow>Приветствуем %player_name%!</yellow>"
    quit:
      - "<red>➖ <gray><white>%player_name%</white> вышел... наверное, за чаем.</gray>"
      - "<gray>%player_name% покинул сервер.</gray>"
      - "<yellow>До встречи, %player_name%!</yellow>"

  # ─── VIP ───
  vip:
    join:
      - "<yellow>👑 VIP <white>%player_name%</white> соизволил появиться. Ложитесь лицом к полу!</yellow>"
      - "<gold>VIP %player_name% присоединился к серверу!</gold>"
      - "<green>Привет VIP %player_name%!</green>"
      - "<gold>👑 <white>%player_name%</white> (VIP) на связи!</gold>"
      - "<yellow>VIP %player_name% здесь. Праздник начинается!</yellow>"
    quit:
      - "<gold>👋 VIP <white>%player_name%</white> ушёл. Сервер стал на 5% менее гламурным.</gold>"
      - "<yellow>VIP %player_name% покинул нас.</yellow>"
      - "<gray>Прощай, VIP %player_name%!</gray>"
      - "<gold>👋 %player_name% (VIP) отчалил.</gold>"
      - "<gray>VIP %player_name% ушёл. Стало скучно.</gray>"

  # ─── Moderator ───
  moderator:
    join:
      - "<blue>🛡 Модератор <white>%player_name%</white> на связи!</blue>"
      - "<blue>🛡 <white>%player_name%</white> (Модератор) следит за порядком!</blue>"
      - "<aqua>Модератор %player_name% прибыл!</aqua>"
      - "<blue>🛡 %player_name% здесь. Всем спокойно!</blue>"
      - "<aqua>Модератор на связи!</aqua>"
    quit:
      - "<blue>🛡 Модератор %player_name% ушёл.</blue>"
      - "<aqua>%player_name% (Модератор) покинул нас.</aqua>"
      - "<gray>Модератор вышел.</gray>"
      - "<blue>Прощай, %player_name%!</blue>"
      - "<aqua>Модератор отчалил.</aqua>"

  # ─── Admin ───
  admin:
    join:
      - "<red>⚡ Владыка сервера <white>%player_name%</white> снизошёл к смертным!</red>"
      - "<dark_red>%player_name% появился среди нас. Почти как бог.</dark_red>"
      - "<gold>О, великий %player_name% вошёл!</gold>"
      - "<red>⚡ Админ <white>%player_name%</white> на связи!</red>"
      - "<dark_red>Владыка %player_name% вернулся.</dark_red>"
    quit:
      - "<dark_red>⚡ <white>%player_name%</white> — админ вышел. Беспредел отменяется.</dark_red>"
      - "<gray>%player_name% покинул сервер. Легенда ушла.</gray>"
      - "<yellow>До свидания, великий %player_name%!</yellow>"
      - "<dark_red>Админ %player_name% ушёл.</dark_red>"
      - "<red>Владыка покинул нас.</red>"

  # ─── Legend (топ-группа) ───
  legend:
    join:
      - "<rainbow>🌈 Легенда %player_name% прилетела на радуге!</rainbow>"
      - "<rainbow>🌟 %player_name% (Легенда) на связи!</rainbow>"
      - "<rainbow>✨ Легенда %player_name% здесь!</rainbow>"
      - "<rainbow>🎇 %player_name% — живая легенда сервера!</rainbow>"
      - "<rainbow>💫 Легенда %player_name% вернулась!</rainbow>"
    quit:
      - "<rainbow>%player_name% улетел в закат...</rainbow>"
      - "<rainbow>🌈 Легенда %player_name% покинула нас.</rainbow>"
      - "<rainbow>💫 %player_name% ушёл. Небо потемнело.</rainbow>"
      - "<rainbow>🌟 До встречи, %player_name%!</rainbow>"
      - "<rainbow>✨ Легенда отчалила.</rainbow>"

# ═══════════════ DEATH ═══════════════
death:
  pvp:
    - "<red>⚔ {killer} показал {victim}, кто тут босс!</red>"
    - "<gold>{killer}</gold> выписал <red>{victim}</red> пропуск в мир духов!"
    - "<dark_red>{victim}</dark_red> не устоял против могущества {killer}!"

  lava:
    - "<red>🔥 %player_name% пытался обняться с лавой. Не вышло.</red>"
    - "<gold>%player_name%</gold> превратился в шашлык... Не самый вкусный."
    - "<dark_red>%player_name%</dark_red> понял, что лаву лучше смотреть издалека."

  fall:
    - "<gray>💥 %player_name% решил, что умеет летать. Спойлер: нет.</gray>"
    - "<red>☠ %player_name%</red> проиграл битву с гравитацией."
    - "<yellow>%player_name%</yellow> изучил законы физики на практике."

  explosion:
    - "<red>💥 %player_name% взорвался!</red>"
    - "<gold>%player_name%</gold> слишком близко подошёл к взрывчатке."

  drowning:
    - "<blue>💧 %player_name% утонул. Рыбы передают привет.</blue>"
    - "<aqua>%player_name%</aqua> не научился дышать под водой."

  fire:
    - "<red>🔥 %player_name% сгорел. Это было горячо.</red>"
    - "<gold>%player_name%</gold> стал факелом для сервера."

  void:
    - "<dark_purple>🌌 %player_name% упал в пустоту. Прощай, странник.</dark_purple>"
    - "<dark_gray>%player_name%</dark_gray> покинул этот мир буквально."

  player_kill:
    - "<red>💀 %player_name%</red> улетел в лучший мир. По билету без возврата."
    - "<gold>⚰ %player_name%</gold> получил удар судьбы... или киркой."
    - "<gray>%player_name%</gray> неожиданно встретил свою смерть."

  mob:
    ZOMBIE:
      - "<dark_red>%player_name%</dark_red> был влюблен в зомби... теперь это не важно!"
      - "<gold>%player_name%</gold> стал любимым обедом для зомби!"
      - "<gray>%player_name% попытался дружить с зомби, не вышло.</gray>"
    SKELETON:
      - "<gray>%player_name%</gray> стал перекрёстной мишенью для скелетов!"
      - "<white>%player_name%</white> встретил стрелы скелета лицом к лицу!"
      - "<yellow>%player_name%</yellow> понял, что кости могут быть смертельны."
    CREEPER:
      - "<green>%player_name%</green> слишком близко подошёл к зелёному взрывному другу!"
      - "<yellow>%player_name%</yellow> превратился в кучку блоков после встречи с крипером!"
      - "<red>%player_name%</red> не рассчитал дистанцию от крипера!"
    SPIDER:
      - "<dark_purple>%player_name%</dark_purple> запутался в паутине и проиграл!"
      - "<red>%player_name%</red> был укушен пауком!"
      - "<gray>%player_name%</gray> понял, что пауки не друзья."
    WITCH:
      - "<purple>%player_name%</purple> столкнулся с ведьмой и её зелиями!"
      - "<dark_red>%player_name%</dark_red> стал жертвой магии ведьмы!"
      - "<gray>%player_name%</gray> не оценил силу зелий."
    ENDERMAN:
      - "<black>%player_name%</black> встретил эндермена... и исчез почти сразу!"
      - "<purple>%player_name%</purple> был схвачен взглядом эндермена!"
      - "<gray>%player_name%</gray> понял, что смотреть на эндермена опасно."
    WARDEN:
      - "<black>%player_name%</black> услышал стук Варда!"
      - "<dark_gray>%player_name%</dark_gray> не успел убежать!"
      - "<red>%player_name%</red> стал жертвой Варда!"
    default:
      - "<dark_red>%player_name%</dark_red> был убит каким-то злым мобом!"
      - "<gold>%player_name%</gold> стал жертвой загадочного существа!"
      - "<gray>%player_name%</gray> почувствовал смерть."

# ═══════════════ RESPAWN ═══════════════
respawn:
  - "<green>✨ %player_name%, реинкарнация прошла успешно. Удачи в новой жизни!</green>"
  - "<yellow>⚡ %player_name% вернулся к жизни с новыми силами!</yellow>"
  - "<aqua>%player_name% готов к новым приключениям!</aqua>"

# ═══════════════ HOLIDAYS ═══════════════
holidays:
  new_year:
    messages:
      - "<gold>🎄 С Новым Годом, %player_name%!</gold>"
      - "<gradient:#00BFFF:#FFFFFF>❄ Снежинки кружатся вокруг тебя!</gradient>"
  christmas:
    messages:
      - "<red>🎅 С Рождеством, %player_name%!</red>"
  valentine:
    messages:
      - "<red>❤ С Днём Святого Валентина, %player_name%!</red>"
  halloween:
    messages:
      - "<dark_purple>🎃 С Хэллоуином, %player_name%!</dark_purple>"
  easter:
    messages:
      - "<yellow>🐣 Со Светлой Пасхой, %player_name%!</yellow>"
  womens_day:
    messages:
      - "<light_purple>🌷 С 8 Марта, %player_name%!</light_purple>"
  defender_day:
    messages:
      - "<blue>🎖 С Днём Защитника Отечества, %player_name%!</blue>"
  april_fools:
    messages:
      - "<yellow>😜 С 1 Апреля, %player_name%!</yellow>"
  victory_day:
    messages:
      - "<red>🎗 С Днём Победы, %player_name%!</red>"
  default:
    messages:
      - "<gold>🎉 С праздником, %player_name%!</gold>"

# ═══════════════ LINKS ═══════════════
# PAPI: %welcome_vk_url%, %welcome_site_url%, %welcome_discord_url%
links:
  vk: "<click:open_url:'https://vk.com/terracraft'>ВКонтакте</click>"
  site: "<click:open_url:'https://terracraft.net.ru'>Наш сайт</click>"
  discord: "<click:open_url:'https://discord.gg/terracraft'>Discord</click>"
  telegram: "<click:open_url:'https://t.me/terracraft'>Telegram</click>"
  youtube: "<click:open_url:'https://youtube.com/@terracraft'>YouTube</click>"

# ═══════════════ COMMANDS ═══════════════
commands:
  reload:
    success: "<green>✔ Конфигурация перезагружена</green>"
  migrate:
    success: "<green>✔ Конфиг обновлён</green>"
    already_fresh: "<yellow>ℹ Конфиг уже актуален</yellow>"
  language:
    success: "<green>✔ Язык изменён на: <yellow>%lang%</yellow></green>"
    not_found: "<red>✘ Язык не найден</red>"
  gui:
    player_only: "<red>✘ GUI доступен только игрокам!</red>"