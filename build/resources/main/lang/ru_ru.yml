      - "<#FFC107>🎄 С Новым Годом, %player_name%!</#FFC107>"
      - "<gradient:#4CAF50:#FFFFFF>❄ Снежинки кружатся вокруг тебя!</gradient>"
  christmas:
    messages:
      - "<#EF5350>🎅 С Рождеством, %player_name%!</#EF5350>"
  valentine:
    messages:
      - "<#EF5350>❤ С Днём Святого Валентина, %player_name%!</#EF5350>"
  halloween:
    messages:
      - "<#AB47BC>🎃 С Хэллоуином, %player_name%!</#AB47BC>"
  easter:
    messages:
      - "<#FFC107>🐣 Со Светлой Пасхой, %player_name%!</#FFC107>"
  womens_day:
    messages:
      - "<#EC407A>🌷 С 8 Марта, %player_name%!</#EC407A>"
  defender_day:
    messages:
      - "<#42A5F5>🎖 С Днём Защитника Отечества, %player_name%!</#42A5F5>"
  april_fools:
    messages:
      - "<#FFA726>😜 С 1 Апреля, %player_name%!</#FFA726>"
  victory_day:
    messages:
      - "<#EF5350>🎗 С Днём Победы, %player_name%!</#EF5350>"
  default:
    messages:
      - "<gradient:#4CAF50:#FFC107>🎉 С праздником, %player_name%!</gradient>"

# ═══════════════ LINKS ═══════════════
links:
  vk: "<click:open_url:'https://vk.com/play_terra_craft_ru'><gradient:#8BC34A:#FFC107>ВКонтакте</gradient></click>"
  site: "<click:open_url:'https://terracraft.ru'><gradient:#8BC34A:#FFC107>Наш сайт</gradient></click>"
  discord: "<click:open_url:'https://discord.gg/terracraft'><gradient:#8BC34A:#FFC107>Discord</gradient></click>"
  telegram: "<click:open_url:'https://t.me/terracraft'><gradient:#8BC34A:#FFC107>Telegram</gradient></click>"
  youtube: "<click:open_url:'https://youtube.com/@terracraft'><gradient:#8BC34A:#FFC107>YouTube</gradient></click>"

# ═══════════════ COMMANDS ═══════════════
commands:
  reload:
    success: "<#4CAF50>✔</#4CAF50> <#FFFFFF>Конфигурация перезагружена</#FFFFFF> <#B0BEC5>(%time%мс)</#B0BEC5>"
    error: "<#EF5350>✘ Ошибка перезагрузки:</#EF5350> <white>%error%</white>"
  language:
    success: "<#4CAF50>✔</#4CAF50> <#FFFFFF>Язык изменён на:</#FFFFFF> <#FFC107>%lang%</#FFC107>"
    not_found: "<#EF5350>✘ Язык не найден</#EF5350>"
  gui:
    player_only: "<#EF5350>✘ GUI доступен только игрокам!</#EF5350>"

