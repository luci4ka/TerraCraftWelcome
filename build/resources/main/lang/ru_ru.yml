    - "<#1B5E20>║</#1B5E20> <#FFC107>/welcome gui</#FFC107> <#FFFFFF>— Меню настроек</#FFFFFF>"
    - "<#1B5E20>║</#1B5E20> <#FFC107>/welcome language <lang></#FFC107> <#FFFFFF>— Сменить язык</#FFFFFF>"
  footer:
    - "<#1B5E20>╚══════════════════════════════════════╝</#1B5E20>"

# ═══════════════ INFO ═══════════════
info:
  header:
    - "<#1B5E20>╔══════════════════════════════════════╗</#1B5E20>"
    - "<#1B5E20>║</#1B5E20>     <gradient:#4CAF50:#FFC107>Welcome Plugin</gradient>"
