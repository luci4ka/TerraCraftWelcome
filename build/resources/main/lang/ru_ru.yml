    - "<#1B5E20>╠══════════════════════════════════════╣</#1B5E20>"
  commands:
    - "<#1B5E20>║</#1B5E20> <#FFC107>/welcome</#FFC107> <#FFFFFF>— Приветствие</#FFFFFF>"
    - "<#1B5E20>║</#1B5E20> <#FFC107>/welcome version</#FFC107> <#FFFFFF>— Версия</#FFFFFF>"
    - "<#1B5E20>║</#1B5E20> <#FFC107>/welcome help</#FFC107> <#FFFFFF>— Эта справка</#FFFFFF>"
  admin:
    - "<#1B5E20>╠══════════════════════════════════════╣</#1B5E20>"
    - "<#1B5E20>║</#1B5E20> <#EF5350>Администратор:</#EF5350>"
