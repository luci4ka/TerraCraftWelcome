# English language - Welcome Plugin

motd:
  lines:
    - "<dark_purple>| <gold>Hey, %player_name%!</gold></dark_purple>"
    - "<dark_purple>| <gray>Glad to see you back on the server!</gray>"
    - "<dark_purple>| <green>Join our %vk_text%:</green>"
    - "<dark_purple>| <green>Our %site_text%:</green>"
    - "<dark_purple>| <green>Join our %discord_text%:</green>"
    - "<dark_purple>| <gray>Enjoy the game!</gray>"

titles:
  first_join:
    title: "<gold>Welcome!</gold>"
    subtitle: "<gray>%player_name%, it's your first time!</gray>"
  join:
    title: "<green>Welcome back!</green>"
    subtitle: "<gray>%player_name%</gray>"
  death:
    title: "<red>You died!</red>"
    subtitle: "<gray>But you'll be back...</gray>"

join:
  first_join:
    - "<gold>🎉 New player! Welcome <white>%player_name%</white>!</gold>"
  default:
    - "<green>➕ <white>%player_name%</white> joined the game!</green>"
  vip:
    - "<yellow>👑 VIP <white>%player_name%</white> joined!</yellow>"
  admin:
    - "<red>⚡ Admin <white>%player_name%</white> joined!</red>"

quit:
  default:
    - "<red>➖ <white>%player_name%</white> left the server.</red>"
  vip:
    - "<gold>👋 VIP <white>%player_name%</white> left.</gold>"
  admin:
    - "<dark_red>⚡ Admin <white>%player_name%</white> left.</dark_red>"

death:
  pvp:
    - "<red>⚔ {killer} killed {victim}!</red>"
  lava:
    - "<red>🔥 %player_name% tried to swim in lava.</red>"
  fall:
    - "<gray>💥 %player_name% fell to their death.</gray>"
  player_kill:
    - "<red>💀 %player_name% died!</red>"
  mob:
    default:
      - "<dark_red>%player_name% was killed by a mob!</dark_red>"

respawn:
  - "<green>✨ %player_name% respawned!</green>"

auto_messages:
  - "<green>Check out our website!</green>"
  - "<aqua>Follow us on social media!</aqua>"

commands:
  reload: "<green>✓ Configuration reloaded!</green>"
  no_permission: "<red>You don't have permission!</red>"
  language_changed: "<green>Language changed to: {lang}</green>"