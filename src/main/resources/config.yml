# Версия конфигурации
config-version: 2.2

# =========================
# ЯЗЫК
# =========================
language: "ru"  # ru, en

# =========================
# ССЫЛКИ
# =========================
links:
  vk_url: "https://vk.com/grand_mc"
  vk_text: "Вконтакте"
  discord_url: "https://discord.gg/NTBdkEH"
  discord_text: "Дискорд сервер"
  site_url: "http://grandmc.ddns.net"
  site_text: "Сайт"

# =========================
# ОБЩИЕ НАСТРОЙКИ
# =========================
messages:
  local:
    motd:
      enabled: true
    join_title:
      enabled: true
      fade_in: 10
      stay: 70
      fade_out: 20
    actionbar:
      enabled: true

  global:
    join: true
    quit: true
    respawn: true
    death: true

# =========================
# АВТО-СООБЩЕНИЯ
# =========================
auto_messages:
  enabled: true
  interval_ticks: 6000  # 5 минут
  permission: ""  # Оставь пустым для всех
  worlds: []      # Оставь пустым для всех миров

  # Персонажи
  characters:
    - name: "Лисёнок"
      color: "<green>"
      prefix: "🦊"
      moods:
        happy: "😊"
        surprised: "😮"
        excited: "🎉"
    - name: "Волшебник"
      color: "<aqua>"
      prefix: "🧙"
      moods:
        happy: "✨"
        angry: "⚡"
        thoughtful: "🤔"
    - name: "Рыцарь"
      color: "<gold>"
      prefix: "🛡"
      moods:
        proud: "🗡"
        cautious: "⚔️"
        cheerful: "😄"
    - name: "Советник"
      color: "<yellow>"
      prefix: "📜"
      moods:
        wise: "📖"
        serious: "⚠️"
        friendly: "🙂"
    - name: "Гном"
      color: "<dark_aqua>"
      prefix: "⛏"
      moods:
        hardworking: "💪"
        grumpy: "😠"
        cheerful: "😃"

# =========================
# НАСТРОЙКИ
# =========================
settings:
  # Эффекты
  effects:
    first_join:
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "FIREWORKS_SPARK"
      firework: true
    normal_join:
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "EXPLOSION_LARGE"
    leave:
      sound: "BLOCK_NOTE_BLOCK_PLING"
      particle: "VILLAGER_HAPPY"
    death:
      sound: "ENTITY_PLAYER_HURT"
      particle: "SMOKE_NORMAL"
    respawn:
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "HEART"
    killer:
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "EXPLOSION_LARGE"

  # Звуки
  sound:
    enable_sound: true
    volume: 1.0
    pitch: 1.0

  # Частицы
  particle_effect:
    enable_particles: true
    amount: 5

  # Босс-трекер (всё в одной секции!)
  boss_fight:
    enabled: true
    track_damage: true
    show_top_hitters: true
    max_top_players: 5
    min_damage: 0.0
    boss_names: []  # Пустой = использовать boss_list
    worlds: []       # Пустой = все миры

    # Список боссов
    boss_list:
      ENDER_DRAGON:
        name: "Эндер Дракон"
        health_multiplier: 1.0
        track_damage: true
      WITHER:
        name: "Визер"
        health_multiplier: 1.0
        track_damage: true
      WARDEN:
        name: "Хранитель"
        health_multiplier: 1.5
        track_damage: true
      ZOMBIE:
        name: "Зомби-босс"
        health_multiplier: 3.0
        track_damage: true
      PIGLIN_BRUTE:
        name: "Пиглин-варвар"
        health_multiplier: 2.0
        track_damage: true

    # Награды
    rewards:
      enabled: true
      # Топ-1
      place_1:
        commands:
          - "give %player% diamond 5"
          - "give %player% netherite_ingot 1"
        items:
          - "DIAMOND_SWORD:1:sharpness:5:unbreaking:3"
          - "GOLDEN_APPLE:5"
        money: 1000.0
        experience: 500
      # Топ-2
      place_2:
        commands:
          - "give %player% diamond 3"
        items:
          - "DIAMOND_PICKAXE:1:efficiency:5:fortune:3"
          - "ENDER_PEARL:16"
        money: 500.0
        experience: 300
      # Топ-3
      place_3:
        commands:
          - "give %player% diamond 1"
        items:
          - "IRON_INGOT:32"
          - "GOLDEN_APPLE:3"
        money: 250.0
        experience: 150

  # Праздники
  holidays:
    enabled: false
    interval_ticks: 1200
    current: "auto"  # auto, new_year, halloween, etc.
    settings:
      volume: 1.0
      pitch: 1.0
      particle_amount: 10
      send_messages: true