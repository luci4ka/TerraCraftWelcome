config-version: 2

messages:
  local:
    motd:
      - "<dark_purple>| <gold>Приветик, %player_name%!</gold></dark_purple>"
      - "<dark_purple>| <gray>Рады видеть тебя снова на сервере!</gray>"
      - "<dark_purple>| <green>Подключайся к нашему VK:</green> <blue><click:open_url:%vk_url%>%vk_text%</click></blue>"
      - "<dark_purple>| <green>Наш сайт:</green> <blue><click:open_url:%site_url%>%site_text%</click></blue>"
      - "<dark_purple>| <green>Присоединяйся к нам в Discord:</green> <blue><click:open_url:%discord_url%>%discord_text%</click></blue>"
      - "<dark_purple>| <gray>Желаем приятной игры!</gray>"
      - "<dark_purple>| <bold><aqua>Время веселья!</aqua></bold>"
      - "<dark_purple>| <reset><italic>Используйте команду /help для получения списка команд.</italic></reset>"
      - ""

  global:
    death: true
    join: true
    pvp_message:
      messages:
        - '<red>⚔️ {killer} убил {victim}!</red>'
        - '<gold>{killer}</gold> одержал победу над <red>{victim}</red> в бою!'
    lava_message:
      messages:
        - '<dark_red>%player_name%</dark_red> сгорел в лаве!'
        - '<gold>%player_name%</gold> погиб в огне лавы.'
    fall_message:
      messages:
        - '<dark_red>%player_name%</dark_red> упал с большой высоты!'
        - '<gold>%player_name%</gold> погиб от падения!'
    player_kill_message:
      messages:
        - '<red>%player_name%</red> погиб!'
        - '<gold>%player_name%</gold> умер!'
    respawn_message:
      messages:
        - 'Ты снова на ногах, %player_name%!'
    first_join_message:
      - "<gold>🌟 Игрок <white>%player_name%</white> впервые зашел на сервер!</gold>"
    default_join_message:
      - "<green>+ <gray>Игрок <white>%player_name%</white> зашел на сервер.</gray>"
    default_quit_message:
      - "<red>- <gray>Игрок <white>%player_name%</white> вышел с сервера.</gray>"
    vip_join_message:
      - "<gold>🌟 VIP <white>%player_name%</white> зашел на сервер!</gold>"
    vip_quit_message:
      - "<yellow>👑 VIP <white>%player_name%</white> покинул сервер.</yellow>"
    admin_join_message:
      - "<red>⚡ Администратор <white>%player_name%</white> вошел в игру!</red>"
    admin_quit_message:
      - "<dark_red>⚡ Администратор <white>%player_name%</white> покинул сервер!</dark_red>"
    mob_death_message:
      ZOMBIE:
        - "<dark_red>%player_name%</dark_red> был влюблен в зомби... теперь это не важно!"
        - "<gold>%player_name%</gold> стал любимым обедом для зомби!"
      SKELETON:
        - "<dark_red>%player_name%</dark_red> попал в цель и стал скелетным примером!"
        - "<gold>%player_name%</gold> провел слишком много времени в стрелке скелета!"
      CREEPER:
        - "<dark_red>%player_name%</dark_red> пытался стать другом крипера... и это стоило ему жизни!"
        - "<gold>%player_name%</gold> взорвался от счастья... но больше не будет!"
      SPIDER:
        - "<dark_red>%player_name%</dark_red> пытался поиграть с пауком... теперь он — паутина!"
        - "<gold>%player_name%</gold> стал любимым ужином для паука!"
      CAVE_SPIDER:
        - "<dark_red>%player_name%</dark_red> перешел черту и встретился с пещерным пауком… его больше нет."
        - "<gold>%player_name%</gold> был забит в углу маленьким, но смертоносным пауком!"
      ENDERMAN:
        - "<dark_red>%player_name%</dark_red> вряд ли хотел встретиться с эндерменом так близко!"
        - "<gold>%player_name%</gold> случайно взглянул на эндермена... и это стало его концом!"
      WITCH:
        - "<dark_red>%player_name%</dark_red> выпил зелье и почувствовал себя... мертвым!"
        - "<gold>%player_name%</gold> столкнулся с ведьмой... и она его зельем отравила!"
      BLAZE:
        - "<dark_red>%player_name%</dark_red> решил стать жареным мясом... и стал!"
        - "<gold>%player_name%</gold> был зажарен до хрустящей корочки Блейзом!"
      MAGMA_CUBE:
        - "<dark_red>%player_name%</dark_red> прыгал в горячую вуаль магмы… и теперь его нет!"
        - "<gold>%player_name%</gold> расплавился под натиском магматического куба!"
      SLIME:
        - "<dark_red>%player_name%</dark_red> не смог избавиться от липкости слайма!"
        - "<gold>%player_name%</gold> стал частью липкого мира слаймов!"
      GHAST:
        - "<dark_red>%player_name%</dark_red> кричал как душа в аду... и стал частью этого крика!"
        - "<gold>%player_name%</gold> получил огненный привет от Гаста!"
      PIG_ZOMBIE:
        - "<dark_red>%player_name%</dark_red> не понравился свинозомби, и теперь это его проблема!"
        - "<gold>%player_name%</gold> сделал свинозомби своим врагом... и заплатил за это!"
      VEX:
        - "<dark_red>%player_name%</dark_red> не успел сразиться с фантомами… и был пойман Вексом!"
        - "<gold>%player_name%</gold> был взлетевшим с Вексом, больше его нет!"
      PHANTOM:
        - "<dark_red>%player_name%</dark_red> не дремал, но фантомы его все равно нашли!"
        - "<gold>%player_name%</gold> уснул, но фантомы не были добры!"
      ILLAGER:
        - "<dark_red>%player_name%</dark_red> был на грани того, чтобы стать жертвой илладжера!"
        - "<gold>%player_name%</gold> сдался Илледжеру, и теперь больше не видит свет!"
      VINDICATOR:
        - "<dark_red>%player_name%</dark_red> пытался сразиться с Виндиканом… но он был слишком силен!"
        - "<gold>%player_name%</gold> не выдержал удара от Виндиканта!"
      EVOKER:
        - "<dark_red>%player_name%</dark_red> не смог пережить призыв Вокера!"
        - "<gold>%player_name%</gold> встретил злого Вокера и ушел на тот свет!"
      DROPPER:
        - "<dark_red>%player_name%</dark_red> не смог избежать потока смерти!"
        - "<gold>%player_name%</gold> пытался выжить, но в конце концов упал!"
      STRAY:
        - "<dark_red>%player_name%</dark_red> не смог убежать от Стрея в ледяной тундре!"
        - "<gold>%player_name%</gold> замерз под стрелами Стрея!"
      HUSK:
        - "<dark_red>%player_name%</dark_red> встретил Хаска, и этот не мог его оставить в живых!"
        - "<gold>%player_name%</gold> пережил палящее солнце… но не устоял против Хаска!"
      DROWNED:
        - "<dark_red>%player_name%</dark_red> пытался утонуть в водах... и утонул в буквальном смысле!"
        - "<gold>%player_name%</gold> не смог выбраться из водных глубин!"
      ZOMBIFIED_PIGLIN:
        - "<dark_red>%player_name%</dark_red> стал жертвой зомби-свинозомби!"
        - "<gold>%player_name%</gold> был пойман в сети зомби-свинозомби!"
      SILVERFISH:
        - "<dark_red>%player_name%</dark_red> стал жертвой серебрянки… кто знал, что они такие опасные!"
        - "<gold>%player_name%</gold> был съеден серебрянкой!"
      ENDERMITE:
        - "<dark_red>%player_name%</dark_red> не смог победить эндермита, но хотел!"
        - "<gold>%player_name%</gold> был заперт в лапках эндермита!"
      AXOLOTL:
        - "<dark_red>%player_name%</dark_red> не понял, что маленькие водные существа могут быть такими опасными!"
        - "<gold>%player_name%</gold> стал ужином для аксолотля!"
      TURTLE:
        - "<dark_red>%player_name%</dark_red> пытался заиграть с черепахой... и стал ее перекусом!"
        - "<gold>%player_name%</gold> был съеден черепахой!"
      RAVAGER:
        - "<dark_red>%player_name%</dark_red> был раздавлен Раведжером!"
        - "<gold>%player_name%</gold> стал мощной жертвой Раведжера!"

      # Сообщение по умолчанию для мобов, которые не указаны
      default:
        - "<dark_red>%player_name%</dark_red> был убит каким-то злым мобом!"
        - "<gold>%player_name%</gold> стал жертвой загадочного существа!"

effects:
  first_join:
    sound: "ENTITY_PLAYER_LEVELUP"
    particle: "FIREWORKS_SPARK"
  normal_join:
    sound: "ENTITY_PLAYER_LEVELUP"
    particle: "EXPLOSION_LARGE"
  leave:
    sound: "BLOCK_NOTE_BLOCK_PLING"
    particle: "VILLAGER_HAPPY"
  death:
    sound: "ENTITY_PLAYER_HURT"
    particle: "SMOKE_NORMAL"

sound:
  enable_sound: true
  volume: 1.0
  pitch: 1.0

particle_effect:
  enable_particles: true
  amount: 5

links:
  vk_url: "https://vk.com/grand_mc"
  vk_text: "VK"
  discord_url: "https://discord.gg/NTBdkEH"
  discord_text: "Discord"
  site_url: "http://grandmc.ddns.net"
  site_text: "Сайт"
