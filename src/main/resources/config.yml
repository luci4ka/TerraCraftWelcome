config-version: 2

messages:
  motd: "<gradient:#00FFFF:#0000FF>Добро пожаловать, <white>{player}</white>!"
  default_join_message:
    - "<green>+ <gray>Игрок <white>{player}</white> зашёл на сервер!"
    - "<blue>➤ <gray>Добро пожаловать, <white>{player}</white>!"
  first_join_motd: "<gradient:#FFD700:#FF8C00>Добро пожаловать впервые, <white>{player}</white>!"
  first_join_message:
    - "<gold>🌟 Игрок <white>{player}</white> впервые зашёл на сервер!"
    - "<yellow>➤ Добро пожаловать нового игрока: <white>{player}</white>!"
  leave_message: "<red>- <gray>Игрок <white>{player}</white> вышел."
  death_message: "<dark_red>✖ <gray><white>{player}</white> погиб."

sound:
  enable_sound: true
  sound_type: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 1.0

particle_effect:
  enable_particles: true
  particle_type: FIREWORKS_SPARK
  amount: 50
