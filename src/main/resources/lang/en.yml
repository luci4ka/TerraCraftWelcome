# ═══════════════════════════════════════════
#  Welcome Plugin — English language
# ═══════════════════════════════════════════

# ═══════════════ MOTD ═══════════════
motd:
  lines:
    - "<dark_purple>| <gold>Hello, %player_name%!</gold></dark_purple>"
    - "<dark_purple>| <gray>Glad to see you back on the server!</gray>"
    - "<dark_purple>| <green>VK: %welcome_vk_url%</green>"
    - "<dark_purple>| <green>Website: %welcome_site_url%</green>"
    - "<dark_purple>| <green>Discord: %welcome_discord_url%</green>"
    - "<dark_purple>| <gray>Have a nice game!</gray>"

# ═══════════════ TITLES ═══════════════
titles:
  first_join:
    title: "<gold>Welcome!</gold>"
    subtitle: "<gray>%player_name%, you're new here! <yellow>#%number%</yellow></gray>"
  join:
    title: "<green>Welcome back!</green>"
    subtitle: "<gray>%player_name%</gray>"
  death:
    title: "<red>You died!</red>"
    subtitle: "<gray>But you'll be back...</gray>"

# ═══════════════ ACTION BAR ═══════════════
actionbar:
  first_join: "<gold>✨ Welcome to the server, %player_name%!</gold>"
  join: "<green>Welcome back, %player_name%!</green>"

# ═══════════════ JOIN (first join) ═══════════════
join:
  first_join:
    - "<gold>🎉 Newcomer alert! Let's welcome <white>%player_name%</white> with applause! <gray>(#%number%)</gray></gold>"
    - "<green>✨ <white>%player_name%</white> just joined! <gray>(#%number%)</gray></green>"
    - "<aqua>Welcome, %player_name%! You're newcomer #%number%!</aqua>"

# ═══════════════ GROUPS ═══════════════
#  IDs must match groups.yml
#  A group uses its own messages + messages from "inherits"
groups:

  # ─── Default ───
  default:
    join:
      - "<green>➕ <gray>Oops! <white>%player_name%</white> dropped by for a visit.</gray>"
      - "<blue>%player_name% joined us!</blue>"
      - "<yellow>Welcome %player_name%!</yellow>"
    quit:
      - "<red>➖ <gray><white>%player_name%</white> left... probably to get tea.</gray>"
      - "<gray>%player_name% left the server.</gray>"
      - "<yellow>See you, %player_name%!</yellow>"

  # ─── VIP ───
  vip:
    join:
      - "<yellow>👑 VIP <white>%player_name%</white> has arrived. Bow down!</yellow>"
      - "<gold>VIP %player_name% joined the server!</gold>"
      - "<green>Hi VIP %player_name%!</green>"
      - "<gold>👑 <white>%player_name%</white> (VIP) is online!</gold>"
      - "<yellow>VIP %player_name% is here. Party time!</yellow>"
    quit:
      - "<gold>👋 VIP <white>%player_name%</white> left. Server is 5% less glamorous.</gold>"
      - "<yellow>VIP %player_name% left us.</yellow>"
      - "<gray>Goodbye, VIP %player_name%!</gray>"
      - "<gold>👋 %player_name% (VIP) left.</gold>"
      - "<gray>VIP %player_name% left. Boring now.</gray>"

  # ─── Moderator ───
  moderator:
    join:
      - "<blue>🛡 Moderator <white>%player_name%</white> is online!</blue>"
      - "<blue>🛡 <white>%player_name%</white> (Moderator) keeps order!</blue>"
      - "<aqua>Moderator %player_name% arrived!</aqua>"
      - "<blue>🛡 %player_name% is here. Stay calm!</blue>"
      - "<aqua>Moderator is online!</aqua>"
    quit:
      - "<blue>🛡 Moderator %player_name% left.</blue>"
      - "<aqua>%player_name% (Moderator) left us.</aqua>"
      - "<gray>Moderator left.</gray>"
      - "<blue>Goodbye, %player_name%!</blue>"
      - "<aqua>Moderator left.</aqua>"

  # ─── Admin ───
  admin:
    join:
      - "<red>⚡ Server lord <white>%player_name%</white> has descended upon mortals!</red>"
      - "<dark_red>%player_name% has appeared. Almost like a god.</dark_red>"
      - "<gold>Oh, the great %player_name% has entered!</gold>"
      - "<red>⚡ Admin <white>%player_name%</white> is online!</red>"
      - "<dark_red>Lord %player_name% is back.</dark_red>"
    quit:
      - "<dark_red>⚡ <white>%player_name%</white> — admin left. Chaos is cancelled.</dark_red>"
      - "<gray>%player_name% left the server. The legend is gone.</gray>"
      - "<yellow>Goodbye, great %player_name%!</yellow>"
      - "<dark_red>Admin %player_name% left.</dark_red>"
      - "<red>The lord has left us.</red>"

  # ─── Legend (top group) ───
  legend:
    join:
      - "<rainbow>🌈 Legend %player_name% arrived on a rainbow!</rainbow>"
      - "<rainbow>🌟 %player_name% (Legend) is online!</rainbow>"
      - "<rainbow>✨ Legend %player_name% is here!</rainbow>"
      - "<rainbow>🎇 %player_name% — living legend of the server!</rainbow>"
      - "<rainbow>💫 Legend %player_name% is back!</rainbow>"
    quit:
      - "<rainbow>%player_name% flew into the sunset...</rainbow>"
      - "<rainbow>🌈 Legend %player_name% left us.</rainbow>"
      - "<rainbow>💫 %player_name% left. The sky went dark.</rainbow>"
      - "<rainbow>🌟 See you, %player_name%!</rainbow>"
      - "<rainbow>✨ The legend has left.</rainbow>"

# ═══════════════ DEATH ═══════════════
death:
  pvp:
    - "<red>⚔ {killer} showed {victim} who's boss!</red>"
    - "<gold>{killer}</gold> sent <red>{victim}</red> to the spirit world!"
    - "<dark_red>{victim}</dark_red> couldn't withstand {killer}'s power!"

  lava:
    - "<red>🔥 %player_name% tried to hug lava. It didn't work.</red>"
    - "<gold>%player_name%</gold> turned into barbecue... not the tastiest."
    - "<dark_red>%player_name%</dark_red> learned to admire lava from a distance."

  fall:
    - "<gray>💥 %player_name% thought they could fly. Spoiler: no.</gray>"
    - "<red>☠ %player_name%</red> lost the battle with gravity."
    - "<yellow>%player_name%</yellow> learned physics the hard way."

  explosion:
    - "<red>💥 %player_name% exploded!</red>"
    - "<gold>%player_name%</gold> got too close to explosives."

  drowning:
    - "<blue>💧 %player_name% drowned. Fish say hi.</blue>"
    - "<aqua>%player_name%</aqua> never learned to breathe underwater."

  fire:
    - "<red>🔥 %player_name% burned. That was hot.</red>"
    - "<gold>%player_name%</gold> became a torch for the server."

  void:
    - "<dark_purple>🌌 %player_name% fell into the void. Farewell, traveller.</dark_purple>"
    - "<dark_gray>%player_name%</dark_gray> literally left this world."

  player_kill:
    - "<red>💀 %player_name%</red> flew to a better world. One-way ticket."
    - "<gold>⚰ %player_name%</gold> got hit by fate... or a pickaxe."
    - "<gray>%player_name%</gray> unexpectedly met their death."

  mob:
    ZOMBIE:
      - "<dark_red>%player_name%</dark_red> was in love with a zombie... doesn't matter now!"
      - "<gold>%player_name%</gold> became a zombie's favourite meal!"
      - "<gray>%player_name% tried to befriend a zombie. It didn't work.</gray>"
    SKELETON:
      - "<gray>%player_name%</gray> became target practice for skeletons!"
      - "<white>%player_name%</white> met skeleton arrows face to face!"
      - "<yellow>%player_name%</yellow> learned that bones can be deadly."
    CREEPER:
      - "<green>%player_name%</green> got too close to a green explosive friend!"
      - "<yellow>%player_name%</yellow> turned into a pile of blocks after meeting a creeper!"
      - "<red>%player_name%</red> miscalculated the distance from a creeper!"
    SPIDER:
      - "<dark_purple>%player_name%</dark_purple> got tangled in a web and lost!"
      - "<red>%player_name%</red> was bitten by a spider!"
      - "<gray>%player_name%</gray> learned that spiders aren't friends."
    WITCH:
      - "<purple>%player_name%</purple> met a witch and her potions!"
      - "<dark_red>%player_name%</dark_red> became a victim of witch magic!"
      - "<gray>%player_name%</gray> didn't appreciate the power of potions."
    ENDERMAN:
      - "<black>%player_name%</black> met an enderman... and vanished almost instantly!"
      - "<purple>%player_name%</purple> was caught by an enderman's gaze!"
      - "<gray>%player_name%</gray> learned that looking at endermen is dangerous."
    WARDEN:
      - "<black>%player_name%</black> heard the Warden's heartbeat!"
      - "<dark_gray>%player_name%</dark_gray> didn't run fast enough!"
      - "<red>%player_name%</red> became a victim of the Warden!"
    default:
      - "<dark_red>%player_name%</dark_red> was killed by some evil mob!"
      - "<gold>%player_name%</gold> became a victim of a mysterious creature!"
      - "<gray>%player_name%</gray> felt death."

# ═══════════════ RESPAWN ═══════════════
respawn:
  - "<green>✨ %player_name%, reincarnation successful. Good luck in your new life!</green>"
  - "<yellow>⚡ %player_name% returned to life with new strength!</yellow>"
  - "<aqua>%player_name% is ready for new adventures!</aqua>"

# ═══════════════ HOLIDAYS ═══════════════
holidays:
  new_year:
    messages:
      - "<gold>🎄 Happy New Year, %player_name%!</gold>"
      - "<gradient:#00BFFF:#FFFFFF>❄ Snowflakes are falling around you!</gradient>"
  christmas:
    messages:
      - "<red>🎅 Merry Christmas, %player_name%!</red>"
  valentine:
    messages:
      - "<red>❤ Happy Valentine's Day, %player_name%!</red>"
  halloween:
    messages:
      - "<dark_purple>🎃 Happy Halloween, %player_name%!</dark_purple>"
  easter:
    messages:
      - "<yellow>🐣 Happy Easter, %player_name%!</yellow>"
  womens_day:
    messages:
      - "<light_purple>🌷 Happy Women's Day, %player_name%!</light_purple>"
  defender_day:
    messages:
      - "<blue>🎖 Happy Defender's Day, %player_name%!</blue>"
  april_fools:
    messages:
      - "<yellow>😜 Happy April Fools, %player_name%!</yellow>"
  victory_day:
    messages:
      - "<red>🎗 Happy Victory Day, %player_name%!</red>"
  default:
    messages:
      - "<gold>🎉 Happy holiday, %player_name%!</gold>"

# ═══════════════ LINKS ═══════════════
# PAPI: %welcome_vk_url%, %welcome_site_url%, %welcome_discord_url%
links:
  vk: "<click:open_url:'https://vk.com/terracraft'>VK</click>"
  site: "<click:open_url:'https://terracraft.net.ru'>Website</click>"
  discord: "<click:open_url:'https://discord.gg/terracraft'>Discord</click>"
  telegram: "<click:open_url:'https://t.me/terracraft'>Telegram</click>"
  youtube: "<click:open_url:'https://youtube.com/@terracraft'>YouTube</click>"

# ═══════════════ COMMANDS ═══════════════
commands:
  reload:
    success: "<green>✔ Configuration reloaded</green>"
  migrate:
    success: "<green>✔ Config updated</green>"
    already_fresh: "<yellow>ℹ Config is already up to date</yellow>"
  language:
    success: "<green>✔ Language changed to: <yellow>%lang%</yellow></green>"
    not_found: "<red>✘ Language not found</red>"
  gui:
    player_only: "<red>✘ GUI is available only to players!</red>"