name: TerraCraftWelcome
version: '${version}'
main: ru.terracraft.welcome.WelcomePlugin
api-version: '26.1'
java-version: '25'
authors: [luci]
description: |
  Welcome: оповещения о входе, выходе и смерти игроков
  с настраиваемыми эффектами звука и частиц
website: terra-craft.ru

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    CommandAPI:
      load: BEFORE
      required: true
      join-classpath: true
