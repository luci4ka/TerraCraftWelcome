name: Welcome
version: 2.0
main: luci.welcome.Main
api-version: 1.21
author: luci
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: true

commands:
  wconfig:
    description: Перезагрузка конфига Welcome-плагина
    usage: /wconfig reload
    permission: welcome.reload
  welcome:
    description: Тестирование эффектов приветствия
    usage: /welcome toggle_sound или /welcome toggle_particles
    permission: welcome.test

permissions:
  welcome.reload:
    description: Позволяет перезагружать конфигурацию
    default: op
  welcome.test:
    description: Позволяет тестировать эффекты
    default: op
